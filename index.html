<style>
#bx-splash{position:fixed;inset:0;z-index:99998;background:#0E0B15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s}
#bx-splash img{width:132px;height:132px;border-radius:32px;animation:bxPop 1.2s ease-in-out infinite alternate}
#bx-splash .dots{display:flex;gap:8px}
#bx-splash .dots i{width:9px;height:9px;border-radius:50%;background:#FF3D6E;animation:bxDot .9s ease-in-out infinite}
#bx-splash .dots i:nth-child(2){animation-delay:.15s}#bx-splash .dots i:nth-child(3){animation-delay:.3s}
@keyframes bxPop{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes bxDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
</style>

<!-- Si alguien abre Bocaditos desde el navegador del celu, le explicamos cómo instalarla como app. -->
<style>
#bx-install{position:fixed;inset:0;z-index:99999;display:none;align-items:flex-end;justify-content:center;background:rgba(8,6,14,.6);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
#bx-install .card{width:100%;max-width:440px;background:#1B1530;color:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:bxUp .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes bxUp{from{transform:translateY(100%)}to{transform:none}}
#bx-install .top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
#bx-install img{width:62px;height:62px;border-radius:16px}
#bx-install h2{margin:0;font-size:21px;font-weight:800}
#bx-install p{margin:4px 0 0;font-size:14.5px;line-height:1.35;color:#ffffffcc}
#bx-install ol{margin:6px 0 16px;padding:0;list-style:none;counter-reset:s}
#bx-install li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:9px 0;font-size:15.5px;border-top:1px solid #ffffff14}
#bx-install li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:#FF3D6E;color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
#bx-install b{color:#FFE14D}
#bx-install .row{display:flex;gap:10px}
#bx-install button{flex:1;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:800;font-family:inherit}
#bx-install .go{background:#FF3D6E;color:#fff}
#bx-install .later{background:#ffffff1a;color:#fff;flex:.6}
#bx-install .note{font-size:12.5px;color:#ffffff99;margin:-6px 0 14px}
</style>
<div id="bx-install" role="dialog" aria-label="Instalá Bocaditos">
  <div class="card">
    <div class="top">
      <img src="/apple-touch-icon.png" alt="">
      <div><h2>Instalá Bocaditos</h2><p>Usala como una app: pantalla completa, más rápida y con tu sesión guardada.</p></div>
    </div>
    <ol id="bx-steps"></ol>
    <div class="note" id="bx-note"></div>
    <div class="row"><button class="later" id="bx-later">Ahora no</button><button class="go" id="bx-go">Entendido</button></div>
  </div>
</div>
<script>
(function () {
  var ua = navigator.userAgent;
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  var ios = /iphone|ipad|ipod/i.test(ua), android = /android/i.test(ua);
  if (standalone || !(ios || android)) return;
  try { if (Number(localStorage.getItem("bx-install-later")) > Date.now()) return; } catch (e) {}
  var box = document.getElementById("bx-install"), steps = document.getElementById("bx-steps"), note = document.getElementById("bx-note"), go = document.getElementById("bx-go");
  var deferred = null;
  function li(html) { var el = document.createElement("li"); el.innerHTML = "<span>" + html + "</span>"; steps.appendChild(el); }
  if (ios) {
    li("Tocá <b>Compartir</b> (el cuadrado con la flecha ⬆️)");
    li("Elegí <b>Agregar a inicio</b>");
    li("Abrí Bocaditos <b>desde el ícono</b>");
    if (!/safari/i.test(ua) || /crios|fxios|instagram|fban|fbav/i.test(ua)) note.textContent = "Si no ves esa opción, abrí este link en Safari.";
  } else if (/samsungbrowser/i.test(ua)) {
    // Samsung Internet: el botón de instalar es el ícono ⬇ al lado del link, o el menú ≡ de abajo
    li("Tocá el ícono <b>⬇</b> que está arriba, al lado del link");
    li("Elegí <b>Instalar</b> o <b>Agregar a pantalla de inicio</b>");
    li("Abrí Bocaditos <b>desde el ícono</b>, no desde el navegador");
    note.textContent = "Si no ves el ⬇: tocá ⋮ abajo a la derecha → Agregar página a → Pantalla de inicio.";
  } else {
    li("Tocá el menú <b>⋮</b> arriba a la derecha");
    li("Elegí <b>Instalar app</b> (o <b>Agregar a pantalla principal</b> → <b>Instalar</b>)");
    li("Abrí Bocaditos <b>desde el ícono</b>");
    note.textContent = "Si te ofrece \"Crear acceso directo\", no: elegí Instalar. Así se abre como app, sin el link arriba.";
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    steps.innerHTML = ""; note.textContent = "";
    li("Tocá <b>Instalar</b> y listo: queda el ícono en tu celu");
    go.textContent = "Instalar";
  });
  window.addEventListener("appinstalled", function () { box.style.display = "none"; });
  function hide(days) {
    box.style.display = "none";
    try { localStorage.setItem("bx-install-later", String(Date.now() + days * 864e5)); } catch (e) {}
  }
  document.getElementById("bx-later").onclick = function () { hide(1); };
  go.onclick = function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { hide(1); }); deferred = null; }
    else hide(1);
  };
  setTimeout(function () { box.style.display = "flex"; }, 1200);
})();
if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
</script>
